<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | StudyPal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 430px;
            padding: 36px;
            border-radius: 24px;
            background: #fffdf8;
            box-shadow: 0 18px 50px rgba(35, 55, 70, 0.12);
        }

        .auth-brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-brand h1 {
            margin: 0 0 8px;
        }

        .auth-brand p {
            margin: 0;
            opacity: 0.7;
        }

        .auth-form {
            display: grid;
            gap: 16px;
        }

        .auth-form label {
            font-weight: 600;
        }

        .auth-form input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            margin-top: 7px;
            border: 1px solid #d8dee2;
            border-radius: 12px;
            font-size: 15px;
            background: white;
        }

        .auth-form button {
            border: 0;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .auth-switch {
            text-align: center;
            margin-top: 22px;
        }

        .auth-message {
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 16px;
            background: #eef5f4;
        }

        .auth-message.error {
            background: #fff0ee;
        }
    </style>
</head>

<body>
    <div class="auth-page">

        <div class="auth-card">

            <div class="auth-brand">
                <h1>✦ StudyPal</h1>
                <p>Welcome back. Let's continue studying.</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="auth-message {{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form class="auth-form" method="POST">

                <label>
                    Email
                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </label>

                <label>
                    Password
                    <input
                        type="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </label>

                <button type="submit">
                    Login
                </button>

            </form>

            <div class="auth-switch">
                Don't have an account?
                <a href="{{ url_for('register') }}">Create one</a>
            </div>

        </div>

    </div>
</body>
</html>
